[pytest]
pythonpath = api
testpaths = api/test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Integration tests hit real external services (MinIO, DB, etc.) and are excluded
# by default. Run them with: pytest -m integration
addopts = -m "not integration"
markers =
    integration: requires real external services (MinIO, Postgres, Directus, Kafka)
